global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    retries 3
    option redispatch                 # re-tente sur un autre serveur si échec
    timeout connect 3s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s
    timeout check 2s

# ---------- Frontend public (joint via l'IP virtuelle portée par Keepalived) ----------
frontend fe_http
    bind *:80
    # bind *:443 ssl crt /etc/haproxy/certs/site.pem alpn h2,http/1.1
    # http-request redirect scheme https unless { ssl_fc }

    # Anti-abus : 100 requêtes / 10 s par IP
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

    http-response set-header X-Served-By-LB %[env(HOSTNAME)]
    default_backend be_web

# ---------- Backend : 3 serveurs web ----------
backend be_web
    balance roundrobin                # alternatives : leastconn, source
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 slowstart 10s maxconn 200

    server web1 172.28.0.21:80 check
    server web2 172.28.0.22:80 check
    server web3 172.28.0.23:80 check

# ---------- Stats + endpoint de santé (utilisé par Keepalived) ----------
frontend fe_stats
    bind *:8404
    monitor-uri /healthz
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    # stats auth admin:ChangeMe        # à activer en production
